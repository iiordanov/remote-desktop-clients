name: apk

on:
  push:
    branches: [no-donate-banner]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prebuilt dependencies
        run: |
          chmod +x ./download-prebuilt-dependencies.sh ./bVNC/prepare_project.sh
          ./download-prebuilt-dependencies.sh
          ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Gradle projects and assemble tasks (diagnostics)
        run: |
          chmod +x ./gradlew
          ./gradlew projects || true
          ./gradlew tasks --all | grep -i "assemble" || true

      - name: Build
        run: ./gradlew :aRDP-app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn